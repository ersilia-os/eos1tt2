Slug: mole-embeddings
Status: In progress
Title: MolE molecular embeddings
Description: MolE, Recursion's foundation model for molecular graphs, learns embeddings
  using a transformer with disentangled attention adapted from DeBERTa. Pretraining first
  predicts each atom's local environment in a self-supervised step, then refines embeddings
  on ~456,000 ChEMBL compounds across 1310 bioactivity tasks. The original study
  self-supervised on up to 842 million molecules and showed finetuned MolE topped 10 of 22
  ADMET benchmarks from the Therapeutic Data Commons. Since Recursion never released those
  full weights, Ersilia instead serves the smaller GuacaMol/ChEMBL-pretrained checkpoint.
